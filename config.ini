; AC8 MouseYaw configuration
; Raw mouse counts are never blocked or consumed by this tool.
; dpi is the legacy default; x_dpi/y_dpi are the actual per-axis hardware DPI values.
; full_speed_inches_per_second: physical mouse speed that equals full stick/trigger deflection.
; sensitivity is global; x_sensitivity/y_sensitivity are extra per-axis multipliers.

enabled_on_start=true
toggle_key=F10
poll_hz=1000
source_xinput_slot=-1

dpi=3000
x_dpi=3000
y_dpi=7500
sensitivity=1
x_sensitivity=0.4
y_sensitivity=2.5
full_speed_inches_per_second=2
deadzone_x=0.02
deadzone_y=0
boost_x=0
boost_y=0.24
hold_ms=1
invert_y=false
show_notifications=true
